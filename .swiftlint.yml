# SwiftLint 設定 - フォーマットと品質重視

included:
  - app/HiraganaMatchingGame
  - app/HiraganaMatchingGameTests
  - app/HiraganaMatchingGameUITests

excluded:
  - app/HiraganaMatchingGame/Assets.xcassets
  - app/HiraganaMatchingGame.xcodeproj
  - docs
  - .github
  - scripts

reporter: "xcode"

# 主要ルールのみを有効化
only_rules:
  - line_length
  - trailing_whitespace
  - vertical_whitespace
  - trailing_newline
  - empty_count
  - force_cast
  - force_try
  - force_unwrapping
  - sorted_imports

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_function_declarations: true
  ignores_urls: true

trailing_whitespace:
  ignores_empty_lines: true

todo:
  severity: warning

force_cast:
  severity: warning

force_try:
  severity: warning

force_unwrapping:
  severity: warning

