# SwiftLint 設定 - 現代的 Swift ベストプラクティス (Swift 6.0 対応)

included:
  - app/HiraganaMatchingGame
  - app/HiraganaMatchingGameTests
  - app/HiraganaMatchingGameUITests

excluded:
  - app/HiraganaMatchingGame/Assets.xcassets
  - app/HiraganaMatchingGame.xcodeproj
  - docs
  - .github
  - scripts
  - "*/Generated/*"
  - "*/Derived Data/*"

reporter: "xcode"

# 無効化するルール（段階導入のため）
disabled_rules:
  - identifier_name  # 段階的導入予定
  - type_name        # 段階的導入予定

# オプトイン形式で高度なルールを有効化
opt_in_rules:
  # 構文・スタイル

  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - control_statement
  - discouraged_object_literal
  - empty_string
  - explicit_init
  - file_header
  - first_where
  - implicit_return
  - joined_default_parameter
  - let_var_whitespace
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - nimble_operator
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - single_test_class
  - sorted_first_last
  - sorted_imports
  - switch_case_alignment
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment
  - yoda_condition
  
  # パフォーマンス・メモリ
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - flatmap_over_map_reduce
  - last_where
  - reduce_into
  
  # 安全性
  - fatal_error_message
  - force_unwrapping
  - implicitly_unwrapped_optional
  - legacy_random
  - strong_iboutlet
  - unavailable_function
  
  # Swift 6.0 対応
  - strict_fileprivate
  - unused_closure_parameter
  - unused_enumerated
  - unused_optional_binding

# ルール設定
line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_function_declarations: true
  ignores_urls: true

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

cyclomatic_complexity:
  warning: 10
  error: 20

nesting:
  type_level: 3


trailing_whitespace:
  ignores_empty_lines: true

vertical_whitespace:
  max_empty_lines: 2

force_cast:
  severity: error

force_try:
  severity: warning

force_unwrapping:
  severity: warning

large_tuple:
  warning: 3
  error: 4

function_parameter_count:
  warning: 6
  error: 8

# カスタムルール
custom_rules:
  # TODO/FIXME の管理
  todo_fixme_format:
    name: "TODO/FIXME Format"
    regex: '(TODO|FIXME)(?!:)'
    message: "TODO/FIXME should follow format: TODO: description or FIXME: description"
    severity: warning
  
  # プリント文の制限
  no_print_statements:
    name: "No Print Statements"
    regex: '^\s*print\s*\('
    message: "Use Logger instead of print() for production code"
    severity: warning
    excluded: |
      .*Tests\.swift
      .*UITests\.swift

