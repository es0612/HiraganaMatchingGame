name: Lint (Swift)

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint & SwiftFormat
        run: |
          brew update
          brew install swiftlint swiftformat

      - name: Show tool versions
        run: |
          echo "SwiftLint: $(swiftlint version)"
          echo "SwiftFormat: $(swiftformat --version)"

      - name: SwiftFormat Check
        run: |
          echo "🔧 Checking code formatting..."
          swiftformat --lint . --verbose
          echo "✅ Format check completed"

      - name: SwiftLint Analysis
        run: |
          echo "🧹 Running SwiftLint analysis..."
          # 既存の warning は .swiftlint-baseline.json で凍結し、新規違反だけを --strict で落とす (#25)。
          # 既存 warning を減らしたら baseline を再生成する:
          #   swiftlint lint --quiet --write-baseline .swiftlint-baseline.json
          swiftlint --strict
          echo "✅ Lint analysis completed"

      - name: Quality Gate Summary
        run: |
          echo "🎯 Code quality checks completed successfully!"
          echo "All formatting and linting rules have been enforced."

