name: Unit Tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # 同名シミュレータが複数あると name= 指定は曖昧になるため UDID で指定する
      - name: Pick iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, items in sorted(devices.items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("no iPhone simulator found")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      # UI テストは main でも赤いため #43 が解決するまで対象外（ユニットテストのみ）
      - name: Run unit tests
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild test \
            -project HiraganaMatchingGame.xcodeproj \
            -scheme HiraganaMatchingGame \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:HiraganaMatchingGameTests \
            -resultBundlePath "$RUNNER_TEMP/UnitTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 200

      - name: Summarize results
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/UnitTests.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/UnitTests.xcresult" | python3 -c '
          import json, sys
          s = json.load(sys.stdin)
          print("result=%s passed=%s failed=%s skipped=%s" % (s["result"], s["passedTests"], s["failedTests"], s["skippedTests"]))
          for f in s.get("testFailures", []):
              print("FAIL", f["testIdentifierString"], f["failureText"][:300])
          '
          fi

      - name: Upload xcresult
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UnitTests.xcresult
          path: ${{ runner.temp }}/UnitTests.xcresult
          retention-days: 7
