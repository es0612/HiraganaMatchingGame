# Pre-commit hooks configuration
# Install with: brew install pre-commit && pre-commit install

repos:
  # SwiftFormat / SwiftLint はバージョンを固定せず、brew で入れた最新版を使う（CI と同じ。#17）
  # 事前に: brew upgrade swiftformat swiftlint
  - repo: local
    hooks:
      - id: swiftformat
        name: swiftformat
        entry: swiftformat --config .swiftformat
        language: system
        types: [swift]
      - id: swiftlint
        name: swiftlint
        entry: swiftlint lint --strict --config .swiftlint.yml
        language: system
        types: [swift]

  # General code quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.md$
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: mixed-line-ending
        args: [--fix=lf]

  # Git hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0  
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # Security scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: \.md$

# Configuration
exclude: |
  (?x)^(
    app/HiraganaMatchingGame/Assets\.xcassets/.*|
    app/.*\.xcodeproj/.*|
    app/build/.*|
    docs/.*|
    \.github/.*|
    scripts/.*
  )$

default_stages: [pre-commit]
fail_fast: false

# Command aliases for manual execution
alias:
  format: swiftformat .
  lint: swiftlint
  all: pre-commit run --all-files